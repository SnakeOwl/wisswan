events {
    worker_connections  4096;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # РАБОЧАЯ КОНФИГУРАЦИЯ ДЛЯ ЗАПУСКА ПРОДА НА LOCALHOST, при необходимости это раскоментить, а то что ниже закоментить
    # server {
    #     listen 80;
    #     server_name localhost;

    #     # 1. Сначала проверяем API. Если запрос к API — обрабатываем прямо здесь (на 80 порту)
    #     location /api {    
    #         root /var/www/public;

    #         include fastcgi_params;
    #         fastcgi_pass php-fpm:9000; # БЕЗ http://

    #         # Передаем путь к главному файлу Laravel
    #         fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            
    #         # ВОТ ЭТА СТРОКА: Передает оригинальный URL (например, /api/test) в Laravel
    #         fastcgi_param REQUEST_URI $request_uri;
            
    #         # На всякий случай передаем query-строку (?page=2)
    #         fastcgi_param QUERY_STRING $query_string;
    #     }

    #     # Всё остальное — на Next.js (Frontend)
    #     location / {
    #         proxy_pass http://frontend:3000;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection 'upgrade';
    #         proxy_set_header Host $host;
    #         proxy_cache_bypass $http_upgrade;
            
    #         # Передаем реальный IP пользователя
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #     }
    # }


    # HTTP
    server {
        listen 80;
        server_name wisswan.tech; # Укажи свой домен вместо localhost
        proxy_set_header X-Forwarded-Proto https;
        fastcgi_param HTTPS on;

        # 1. Сначала проверяем API. Если запрос к API — обрабатываем прямо здесь (на 80 порту)
        location /api {    
            root /var/www/public;

            include fastcgi_params;
            fastcgi_pass backend:9000; # БЕЗ http://


            # Передаем путь к главному файлу Laravel
            fastcgi_param SCRIPT_FILENAME $document_root/index.php;
            
            # ВОТ ЭТА СТРОКА: Передает оригинальный URL (например, /api/test) в Laravel
            fastcgi_param REQUEST_URI $request_uri;
            
            # На всякий случай передаем query-строку (?page=2)
            fastcgi_param QUERY_STRING $query_string;
        
            # Важно: Сообщаем Laravel, что "на самом деле" мы на HTTPS, 
            # чтобы ссылки в JSON ответах были правильными
            fastcgi_param HTTPS on; 
        }
        

        # остальное редирект с http -> https
        location / {
            return 301 https://$host$request_uri;
        }
    }


    # Редирект HTTPS www -> HTTPS без www
    server {
        listen 443 ssl;
        server_name www.wisswan.tech;

        ssl_certificate /etc/letsencrypt/live/wisswan.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wisswan.tech/privkey.pem;

        return 301 https://wisswan.tech$request_uri;
    }


    # HTTPS
    server {
        listen 443 ssl;
        server_name wisswan.tech;

        root /var/www/public;
        index index.php;

        # Пути к сертификатам (те, что мы пробросили через volumes в docker-compose)
        ssl_certificate /etc/letsencrypt/live/wisswan.tech/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/wisswan.tech/privkey.pem;

        # Оптимизация SSL (стандартные хорошие настройки)
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Запросы к API (Laravel)
        location /api {
            try_files $uri /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass wisswan-backend:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }

        # Всё остальное — на Next.js (Frontend)
        location / {
            proxy_pass http://wisswan-frontend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            
            # Добавьте эти строки обязательно:
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;

            proxy_cache_bypass $http_upgrade;
        }
    }
}
