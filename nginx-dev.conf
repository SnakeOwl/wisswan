# HTTP
server {
    listen 80;
    server_name localhost;
    
    # 1. Сначала проверяем API. Если запрос к API — обрабатываем прямо здесь (на 80 порту)
    location /api {    
        root /var/www/public;

        include fastcgi_params;
        fastcgi_pass backend:9000; # БЕЗ http://

        # Передаем путь к главному файлу Laravel
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        
        # ВОТ ЭТА СТРОКА: Передает оригинальный URL (например, /api/test) в Laravel
        fastcgi_param REQUEST_URI $request_uri;
        
        # На всякий случай передаем query-строку (?page=2)
        fastcgi_param QUERY_STRING $query_string;
    }

    

    # Всё остальное — на Next.js (Frontend)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Передаем реальный IP пользователя
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
